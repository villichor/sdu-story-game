# 生产环境
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expire: ${APP_JWT_EXPIRE:604800000}

  cas:
    jwt-secret: ${CAS_JWT_SECRET}
    frontend-url: ${FRONTEND_LOGIN_SUCCESS_URL}
    mock-enabled: false
