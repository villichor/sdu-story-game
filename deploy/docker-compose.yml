name: sdu-story-game

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://${SDU_STORY_DB_HOST}:${SDU_STORY_DB_PORT}/${SDU_STORY_DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${SDU_STORY_DB_USERNAME}
      DB_PASSWORD: ${SDU_STORY_DB_PASSWORD}
      APP_JWT_SECRET: ${SDU_STORY_APP_JWT_SECRET}
      CAS_JWT_SECRET: ${SDU_STORY_CAS_JWT_SECRET}
      FRONTEND_LOGIN_SUCCESS_URL: ${SDU_STORY_FRONTEND_LOGIN_SUCCESS_URL}
      APP_CORS_ALLOWED_ORIGINS: ${SDU_STORY_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8001}
    expose:
      - "8080"
    networks:
      - app

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8001:80"
    networks:
      - app

networks:
  app:
    driver: bridge
